<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subscription Management - Register</title>
  </head>
  <body>
    <h1>Register</h1>
    <form>
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        minlength="8"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}"
        title="Password must contain at least 8 characters, one uppercase letter, one lowercase letter, and one special character."
        required
      />
      <button type="submit">Register</button>
    </form>
    <p>Already have an account?</p>
    <a href="login.html">Login</a>
  </body>
</html>
